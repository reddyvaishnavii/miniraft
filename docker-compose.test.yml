networks:
  raft-net:
    driver: bridge

services:
  replica1:
    build: ./replica
    environment:
      REPLICA_ID: replica1
      REPLICA_PORT: 4001
      PEERS: http://replica2:4002,http://replica3:4003
      DATA_DIR: /data
    ports:
      - "14001:4001"
    volumes:
      - replica1-data:/data
    networks: [raft-net]
    restart: unless-stopped

  replica2:
    build: ./replica
    environment:
      REPLICA_ID: replica2
      REPLICA_PORT: 4002
      PEERS: http://replica1:4001,http://replica3:4003
      DATA_DIR: /data
    ports:
      - "14002:4002"
    volumes:
      - replica2-data:/data
    networks: [raft-net]
    restart: unless-stopped

  replica3:
    build: ./replica
    environment:
      REPLICA_ID: replica3
      REPLICA_PORT: 4003
      PEERS: http://replica1:4001,http://replica2:4002
      DATA_DIR: /data
    ports:
      - "14003:4003"
    volumes:
      - replica3-data:/data
    networks: [raft-net]
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      GATEWAY_PORT: 3000
      REPLICAS: http://replica1:4001,http://replica2:4002,http://replica3:4003
    ports:
      - "13000:3000"
    networks: [raft-net]
    depends_on: [replica1, replica2, replica3]
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "18080:8080"
    networks: [raft-net]
    depends_on: [gateway]
    restart: unless-stopped

volumes:
  replica1-data:
  replica2-data:
  replica3-data:
